services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: neavito
      POSTGRES_USER: neavito
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U neavito -d neavito"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres_data:

